# The ambience's slots: what the game asks for by name, and what the pack builder files each
# recording under. A slot holds any number of recordings; the game takes turns between them.
#
# kind = "bed"    a layer that plays continuously while its conditions hold, faded by weight;
#                 cut to `length` seconds of the calmest stretch, played with crossfades
#                 between takes (no loop point is needed in the file)
# kind = "event"  a one-shot scattered in time (and placed around the listener in 3D);
#                 long recordings are cut into several calls of `min`..`max` seconds
# kind = "point"  a sound attached to a verified map object or a spline; looped like a bed
#                 or fired like an event, as `mode` says
# kind = "ir"     an impulse response (kept for the echo of tunnels and courtyards)

