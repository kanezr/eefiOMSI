[package]
name = "omsi-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OMSI plugins: the .opl files of the plugins folder and their DLLs, driven as OMSI drives them"

[dependencies]
libloading = "0.9"
log.workspace = true
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[[bin]]
name = "omsi-plugin-host"
path = "src/bin/omsi-plugin-host.rs"
