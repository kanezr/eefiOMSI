name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BEFORE: ${{ github.event.before }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="HEAD^1..HEAD"
          else
            git fetch -q origin "$BEFORE" 2>/dev/null || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..HEAD"
            else
              range="HEAD~1..HEAD"
            fi
          fi
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="$range" .
