# A new or edited issue is sorted (see .github/scripts/issue_triage.py): its "What is it
# about?" answer becomes an `area: ...` label, a new issue gets the milestone of its kind and
# topic (regressions and crashes v0.1.x), and a crash report is labelled `crash` and, when an
# open issue already has the same panic, closed as its duplicate. Maintainers move what the
# guess got wrong; an issue is never given a milestone again once it has one.
name: Issue triage

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Sort the issue
        run: python3 .github/scripts/issue_triage.py
